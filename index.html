<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Unicode → Bamini Converter</title>

    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Tamil Unicode → Bamini Converter</h1>
    <marquee>
        <strong>Note:</strong> This converter only works for Tamil Unicode text. Please ensure that you are using a Unicode Tamil font like Nirmala UI to type the input text.
    </marquee>

    <main>
        <div class="container unicode">
            <h3>Unicode Tamil (Nirmala UI)</h3>
            <textarea id="unicodeInput" placeholder="தமிழ் எழுதவும்..." oninput="startText()"></textarea>
            <button onclick="resetText()"><i class='bx bx-rotate-ccw'></i> RESET</button>
        </div>
        <div class="container bamini">
            <h3>Bamini Output</h3>
            <textarea id="baminiOutput" class="bamini" readonly></textarea>
            <button onclick="copyBamini()"><i class='bx bx-copy'></i> COPY</button>
        </div>
    </main>

    <footer>
        <p>Developed by <a href="https://github.com/ThanushkarSiva1238">Sivakumar Thanushkar</a></p>
        <span>
            <a href="mailto:thanushkarsivakumar@gmail.com"><i class='bxl bx-gmail'></i></a>
            <a href="https://www.linkedin.com/in/thanushkarsivakumar/"><i class='bxl bx-linkedin'></i></a>
        </span>

    </footer>
    
    <script>
        var text1;
        var newtext;
	
        function startText() {
            text1 = document.getElementById("unicodeInput").value; 
        
            text1 = text1.replace(/ஸ்ரீ/g, "=");
            text1 = text1.replace(/;/g, "@");
            text1 = text1.replace(/,/g, ">");
        
            newtext = text1;
            convertToBamini();
        }

        function convertToBamini() {
            let text = newtext;

            const map = {

                // UYIR EZHUTHUKKAL
                "ஃ":"", "அ":"m", "ஆ":"M", "இ":",", "ஈ":"<",
                "உ":"c", "ஊ":"C", "எ":"v", "ஏ":"V",
                "ஐ":"I", "ஒ":"x", "ஓ":"X", "ஔ":"xs",


                // MEI EZHUTHUKKAL
                // க வரிசை
                "க்":"f;", "க":"f", "கா":"fh", "கி":"fp", "கீ":"fP",
                "கு":"F", "கூ":"$", "கெ":"nf", "கே":"Nf",
                "கை":"if", "கொ":"nfh", "கோ":"Nfh", "கௌ":"nfs",

                // ங வரிசை
                "ங்":"q;", "ங":"q", "ஙா":"qh", "ஙி":"qp", "ஙீ":"qP",
                "ஙு":"q{", "ஙூ":"q+", "ஙெ":"nq", "ஙே":"Nq",
                "ஙை":"iq", "ஙொ":"nqh", "ஙோ":"Nqh", "ஙௌ":"nqs",

                // ச வரிசை
                "ச்":"r;", "ச":"r", "சா":"rh", "சி":"rp", "சீ":"rP",
                "சு":"R", "சூ":"#", "செ":"nr", "சே":"Nr",
                "சை":"ir", "சொ":"nrh", "சோ":"Nrh", "சௌ":"nrs",

                // ஞ வரிசை
                "ஞ்":"Q;", "ஞ":"Q", "ஞா":"Qh", "ஞி":"Qp", "ஞீ":"QP",
                "ஞு":"Q{", "ஞூ":"Q}", "ஞெ":"nQ", "ஞே":"NQ",
                "ஞை":"iQ", "ஞொ":"nQh", "ஞோ":"NQh", "ஞௌ":"nQs",

                // ட வரிசை
                "ட்":"l;", "ட":"l", "டா":"lh", "டி":"b", "டீ":"B",
                "டு":"L", "டூ":"^", "டெ":"nl", "டே":"Nl",
                "டை":"il", "டொ":"nlh", "டோ":"Nlh", "டௌ":"nls",

                // ண வரிசை
                "ண்":"z;", "ண":"z", "ணா":"zh", "ணி":"zp", "ணீ":"zP",
                "ணு":"Z", "ணூ":"Z}", "ணெ":"nz", "ணே":"Nz",
                "ணை":"iz", "ணொ":"nzh", "ணோ":"Nzh", "ணௌ":"nzs",

                // த வரிசை
                "த்":"j;", "த":"j", "தா":"jh", "தி":"jp", "தீ":"jP",
                "து":"J", "தூ":"J}", "தெ":"nj", "தே":"Nj",
                "தை":"ij", "தொ":"njh", "தோ":"Njh", "தௌ":"njs",

                // ந வரிசை
                "ந்":"e;", "ந":"e", "நா":"eh", "நி":"ep", "நீ":"eP",
                "நு":"E", "நூ":"E}", "நெ":"ne", "நே":"Ne",
                "நை":"ie", "நொ":"neh", "நோ":"Neh", "நௌ":"nes",

                // ப வரிசை
                "ப்":"g;", "ப":"g", "பா":"gh", "பி":"gp", "பீ":"gP",
                "பு":"G", "பூ":"G+", "பெ":"ng", "பே":"Ng",
                "பை":"ig", "பொ":"ngh", "போ":"Ngh", "பௌ":"ngs",

                // ம வரிசை
                "ம்":"k;", "ம":"k", "மா":"kh", "மி":"kp", "மீ":"kP",
                "மு":"K", "மூ":"%", "மெ":"nk", "மே":"Nk",
                "மை":"ik", "மொ":"nkh", "மோ":"Nkh", "மௌ":"nks",

                // ய வரிசை
                "ய்":"a;", "ய":"a", "யா":"ah", "யி":"ap", "யீ":"aP",
                "யு":"A", "யூ":"A+", "யெ":"na", "யே":"Na",
                "யை":"ia", "யொ":"nah", "யோ":"Nah", "யௌ":"nas",

                // ர வரிசை
                "ர்":"u;", "ர":"u", "ரா":"uh", "ரி":"up", "ரீ":"uP",
                "ரு":"U", "ரூ":"&", "ரெ":"nu", "ரே":"Nu",
                "ரை":"iu", "ரொ":"nuh", "ரோ":"Nuh", "ரௌ":"nus",

                // ல வரிசை
                "ல்":"y;", "ல":"y", "லா":"yh", "லி":"yp", "லீ":"yP",
                "லு":"Y", "லூ":"Y}", "லெ":"ny", "லே":"Ny",
                "லை":"iy", "லொ":"nyh", "லோ":"Nyh", "லௌ":"nys",

                // வ வரிசை
                "வ்":"t;", "வ":"t", "வா":"th", "வி":"tp", "வீ":"tP",
                "வு":"T", "வூ":"T+", "வெ":"nt", "வே":"Nt",
                "வை":"it", "வொ":"nth", "வோ":"Nth", "வௌ":"nts",

                // ழ வரிசை
                "ழ்":"o;", "ழ":"o", "ழா":"oh", "ழி":"op", "ழீ":"oP",
                "ழு":"O", "ழூ":"*", "ழெ":"no", "ழே":"No",
                "ழை":"io", "ழொ":"noh", "ழோ":"Noh", "ழௌ":"nos",

                // ள வரிசை
                "ள்":"s;", "ள":"s", "ளா":"sh", "ளி":"sp", "ளீ":"sP",
                "ளு":"S", "ளூ":"S}", "ளெ":"ns", "ளே":"Ns",
                "ளை":"is", "ளொ":"nsh", "ளோ":"Nsh", "ளௌ":"nss",

                // ற வரிசை
                "ற்":"w;", "ற":"w", "றா":"wh", "றி":"wp", "றீ":"wP",
                "று":"W", "றூ":"W}", "றெ":"nw", "றே":"Nw",
                "றை":"iw", "றொ":"nwh", "றோ":"Nwh", "றௌ":"nws",

                /* ன */
                "ன்":"d;", "ன":"d", "னா":"dh", "னி":"dp", "னீ":"dP",
                "னு":"D", "னூ":"D}", "னெ":"nd", "னே":"Nd",
                "னை":"id", "னொ":"ndh", "னோ":"Ndh", "னௌ":"nds",


                // VADA EZHUTHUKKAL
                // ஸ வரிசை
                "ஸ்":"];", "ஸ":"]", "ஸா":"]h", "ஸி":"]p", "ஸீ":"]P",
                "ஸு":"]{", "ஸூ":"]_", "ஸெ":"n]", "ஸே":"N]", 
                "ஸை":"i]", "ஸொ":"n]h", "ஸோ":"N]h", "ஸௌ":"n]s",

                // ஹ வரிசை
                "ஹ்":"`;","ஹ":"`", "ஹா":"`h", "ஹி":"`p", "ஹீ":"`P",
                "ஹு":"`{", "ஹூ":"`_", "ஹெ":"n`", "ஹே":"N`", 
                "ஹை":"i`", "ஹொ":"n`h", "ஹோ":"N`h", "ஹௌ":"n`s",

                // ஜ வரிசை
                "ஜ்":"[;", "ஜ":"[", "ஜா":"[h", "ஜி":"[p", "ஜீ":"[P",
                "ஜு":"[{", "ஜூ":"[_", "ஜெ":"n[", "ஜே":"N[", 
                "ஜை":"i[", "ஜொ":"n[h", "ஜோ":"N[h", "ஜௌ":"n[s",

                // ஷ வரிசை
                "ஷ்":"\\;", "ஷ":"\\", "ஷா":"\\h", "ஷி":"\\p", "ஷீ":"\\P",
                "ஷு":"\\{", "ஷூ":"\\_", "ஷெ":"n\\", "ஷே":"N\\", 
                "ஷை":"i\\", "ஷொ":"n\\h", "ஷோ":"N\\h", "ஷௌ":"n\\s",
            };

            // Sort keys by length descending (important for multi-char sequences)
            const keys = Object.keys(map).sort((a,b) => b.length - a.length);

            keys.forEach(k => {
                const re = new RegExp(k, "g");
                text = text.replace(re, map[k]);
            });

            document.getElementById("baminiOutput").value = text;
        }

        function resetText() {
            document.getElementById("unicodeInput").value = "";
            document.getElementById("baminiOutput").value = "";
        }

        function copyBamini() {
            const output = document.getElementById("baminiOutput");

            output.removeAttribute("readonly"); // required for mobile
            output.select();
            output.setSelectionRange(0, 99999); // mobile support

            document.execCommand("copy");

            output.setAttribute("readonly", true);

            alert("Bamini text copied!");
        }
    </script>
</body>
</html>
