<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Converter – Bamini ⇄ Unicode</title>

    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        /* Switch (tabs) */
        .switch {
            display: inline-flex;
            margin: 12px 0 4px;
            border: 2px solid #25343F;
            border-radius: 999px;
            overflow: hidden;
        }
        .switch button {
            font-family: "poppins", sans-serif;
            font-size: 15px;
            font-weight: 600;
            padding: 8px 18px;
            border: none;
            background: transparent;
            color: #25343F;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .switch button.active { background: #FF9B51; }
        .switch button:not(.active):hover { background: #BFC9D1; }
        textarea { user-select: text; }
        @media (max-width: 480px) {
            .switch button { font-size: 13px; padding: 7px 12px; }
        }
    </style>
</head>

<body>
    <h1>Tamil Converter</h1>

    <div class="switch">
        <button id="tabB2U" class="active" onclick="setMode('b2u')">Bamini → Unicode</button>
        <button id="tabU2B" onclick="setMode('u2b')">Unicode → Bamini</button>
    </div>

    <marquee id="note"></marquee>

    <main>
        <div class="container" id="inBox">
            <h3 id="inTitle"></h3>
            <textarea id="input" oninput="convert()"></textarea>
            <button onclick="resetText()"><i class='bx bx-rotate-ccw'></i> RESET</button>
        </div>

        <div class="container" id="outBox">
            <h3 id="outTitle"></h3>
            <textarea id="output" readonly></textarea>
            <button onclick="copyOutput()" id="copyButton"><i class='bx bx-copy'></i> COPY</button>
        </div>
    </main>

    <footer>
        <p>
            Developed by
            <a href="https://github.com/ThanushkarSiva1238">Sivakumar Thanushkar</a>
        </p>
        <span>
            <a href="mailto:thanushkarsivakumar@gmail.com"><i class='bxl bx-gmail'></i></a>
            <a href="https://www.linkedin.com/in/thanushkarsivakumar/"><i class='bxl bx-linkedin'></i></a>
        </span>
    </footer>

    <script>
        // Single source of truth: Unicode / Bamini pairs.
        // The Bamini → Unicode map is generated by reversing this one.
        const PAIRS = [
            // Uyir
            "ஃ / அ m ஆ M இ , ஈ < உ c ஊ C எ v ஏ V ஐ I ஒ x ஓ X ஔ xs",
            // Mei
            "க் f; க f கா fh கி fp கீ fP கு F கூ $ கெ nf கே Nf கை if கொ nfh கோ Nfh கௌ nfs",
            "ங் q; ங q ஙா qh ஙி qp ஙீ qP ஙு q{ ஙூ q+ ஙெ nq ஙே Nq ஙை iq ஙொ nqh ஙோ Nqh ஙௌ nqs",
            "ச் r; ச r சா rh சி rp சீ rP சு R சூ # செ nr சே Nr சை ir சொ nrh சோ Nrh சௌ nrs",
            "ஞ் Q; ஞ Q ஞா Qh ஞி Qp ஞீ QP ஞு Q{ ஞூ Q} ஞெ nQ ஞே NQ ஞை iQ ஞொ nQh ஞோ NQh ஞௌ nQs",
            "ட் l; ட l டா lh டி b டீ B டு L டூ ^ டெ nl டே Nl டை il டொ nlh டோ Nlh டௌ nls",
            "ண் z; ண z ணா zh ணி zp ணீ zP ணு Z ணூ Z} ணெ nz ணே Nz ணை iz ணொ nzh ணோ Nzh ணௌ nzs",
            "த் j; த j தா jh தி jp தீ jP து J தூ J} தெ nj தே Nj தை ij தொ njh தோ Njh தௌ njs",
            "ந் e; ந e நா eh நி ep நீ eP நு E நூ E} நெ ne நே Ne நை ie நொ neh நோ Neh நௌ nes",
            "ப் g; ப g பா gh பி gp பீ gP பு G பூ G+ பெ ng பே Ng பை ig பொ ngh போ Ngh பௌ ngs",
            "ம் k; ம k மா kh மி kp மீ kP மு K மூ % மெ nk மே Nk மை ik மொ nkh மோ Nkh மௌ nks",
            "ய் a; ய a யா ah யி ap யீ aP யு A யூ A+ யெ na யே Na யை ia யொ nah யோ Nah யௌ nas",
            "ர் u; ர u ரா uh ரி up ரீ uP ரு U ரூ & ரெ nu ரே Nu ரை iu ரொ nuh ரோ Nuh ரௌ nus",
            "ல் y; ல y லா yh லி yp லீ yP லு Y லூ Y} லெ ny லே Ny லை iy லொ nyh லோ Nyh லௌ nys",
            "வ் t; வ t வா th வி tp வீ tP வு T வூ T+ வெ nt வே Nt வை it வொ nth வோ Nth வௌ nts",
            "ழ் o; ழ o ழா oh ழி op ழீ oP ழு O ழூ * ழெ no ழே No ழை io ழொ noh ழோ Noh ழௌ nos",
            "ள் s; ள s ளா sh ளி sp ளீ sP ளு S ளூ S} ளெ ns ளே Ns ளை is ளொ nsh ளோ Nsh ளௌ nss",
            "ற் w; ற w றா wh றி wp றீ wP று W றூ W} றெ nw றே Nw றை iw றொ nwh றோ Nwh றௌ nws",
            "ன் d; ன d னா dh னி dp னீ dP னு D னூ D} னெ nd னே Nd னை id னொ ndh னோ Ndh னௌ nds",
            // Vada
            "ஸ் ]; ஸ ] ஸா ]h ஸி ]p ஸீ ]P ஸு ]{ ஸூ ]_ ஸெ n] ஸே N] ஸை i] ஸொ n]h ஸோ N]h ஸௌ n]s",
            "ஹ் `; ஹ ` ஹா `h ஹி `p ஹீ `P ஹு `{ ஹூ `_ ஹெ n` ஹே N` ஹை i` ஹொ n`h ஹோ N`h ஹௌ n`s",
            "ஜ் [; ஜ [ ஜா [h ஜி [p ஜீ [P ஜு [{ ஜூ [_ ஜெ n[ ஜே N[ ஜை i[ ஜொ n[h ஜோ N[h ஜௌ n[s",
            "ஷ் \\; ஷ \\ ஷா \\h ஷி \\p ஷீ \\P ஷு \\{ ஷூ \\_ ஷெ n\\ ஷே N\\ ஷை i\\ ஷொ n\\h ஷோ N\\h ஷௌ n\\s"
        ];

        const U2B = {};
        PAIRS.join(" ").split(/\s+/).forEach((tok, i, arr) => {
            if (i % 2 === 0) U2B[tok] = arr[i + 1];
        });

        // Bamini typing special cases (not part of the letter tables)
        const SPECIAL = { "ஸ்ரீ": "=", ";": "@", ",": ">" };
        Object.assign(U2B, SPECIAL);

        const B2U = {};
        Object.keys(U2B).forEach(k => { B2U[U2B[k]] = k; });

        // Build one-pass, longest-match-first converters
        function buildConverter(map) {
            const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const keys = Object.keys(map).sort((a, b) => b.length - a.length);
            const re = new RegExp(keys.map(esc).join("|"), "g");
            return text => text.replace(re, m => map[m]);
        }

        const convertors = {
            b2u: buildConverter(B2U),
            u2b: buildConverter(U2B)
        };

        const UI = {
            b2u: {
                inTitle: "Bamini Input",
                outTitle: "Unicode Tamil Output",
                inClass: "bamini", outClass: "unicode",
                placeholder: "Type or paste Bamini Tamil text...",
                note: "This converter converts Bamini Tamil text into Unicode Tamil text."
            },
            u2b: {
                inTitle: "Unicode Tamil (Nirmala UI)",
                outTitle: "Bamini Output",
                inClass: "unicode", outClass: "bamini",
                placeholder: "தமிழில் தட்டச்சு செய்யவும்...",
                note: "This converter only works for Tamil Unicode text. Please use a Unicode Tamil font like Nirmala UI to type the input."
            }
        };

        let mode = "b2u";

        function setMode(m) {
            mode = m;
            const ui = UI[m];

            document.getElementById("tabB2U").classList.toggle("active", m === "b2u");
            document.getElementById("tabU2B").classList.toggle("active", m === "u2b");

            document.getElementById("inTitle").textContent = ui.inTitle;
            document.getElementById("outTitle").textContent = ui.outTitle;
            document.getElementById("inBox").className = "container " + ui.inClass;
            document.getElementById("outBox").className = "container " + ui.outClass;
            document.getElementById("input").placeholder = ui.placeholder;
            document.getElementById("note").innerHTML = "<strong>Note:</strong> " + ui.note;
            document.title = m === "b2u" ? "Bamini → Tamil Unicode Converter" : "Tamil Unicode → Bamini Converter";

            resetText();
        }

        function convert() {
            const text = document.getElementById("input").value;
            document.getElementById("output").value = convertors[mode](text);
            resetCopyLabel();
        }

        function resetText() {
            document.getElementById("input").value = "";
            document.getElementById("output").value = "";
            resetCopyLabel();
        }

        function resetCopyLabel() {
            document.getElementById("copyButton").innerHTML = "<i class='bx bx-copy'></i> COPY";
        }

        function copyOutput() {
            const output = document.getElementById("output");

            output.removeAttribute("readonly"); // required for mobile
            output.select();
            output.setSelectionRange(0, 99999);
            document.execCommand("copy");
            output.setAttribute("readonly", true);

            document.getElementById("copyButton").innerHTML =
                "<i class='bx bx-clipboard-check'></i> COPIED";
        }

        setMode("b2u");
    </script>
</body>
</html>
